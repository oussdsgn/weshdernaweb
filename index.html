<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wesh Derna? · Events and places in Algerian cities</title>
<meta name="description" content="Events and places in Algerian cities. Free on Android and in your browser.">
<meta name="theme-color" content="#010101">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500&display=swap">
<style>
  :root { --bg: #010101; --text: #fff; --muted: #4f4f4f; --accent: #196fd6; --glow: #1a6fd6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Poppins", system-ui, sans-serif;
    font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }

  .page { position: relative; min-height: 100vh; min-height: 100svh; padding: 0 32px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  /* The brand-blue light behind the phone */
  .glow { position: absolute; inset: 0; filter: blur(112px); pointer-events: none; overflow: hidden; }
  .glow::before { content: ""; position: absolute; left: 55%; top: 33%; width: 40%; height: 40%; transform: translate(-50%, -50%); border-radius: 9999px; background: var(--glow); }

  .logo { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); z-index: 2; line-height: 0; }
  .logo img { height: 24px; width: auto; display: block; }

  /* The phone fades out into the headline */
  .phone { position: relative; width: 100%; height: 320px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 67.5%, transparent); mask-image: linear-gradient(#000 67.5%, transparent); }
  .phone .frame, .phone .screen { position: absolute; left: 50%; transform: translateX(-50%); }
  .phone .frame { top: 0; width: 347px; height: 669px; object-fit: contain; }
  .phone .screen { top: 19px; width: 291px; height: 630px; object-fit: cover; border-radius: 36px; }

  .copy { position: relative; width: 100%; text-align: center; }
  h1, h2 { font-family: "Anton", Impact, sans-serif; font-weight: 400; letter-spacing: 0.01em; }
  h1 { margin: 0; font-size: 52px; line-height: 1.1; text-wrap: balance; }
  .sub { margin: 12px 0 0; color: var(--muted); }

  /* The pill that held the waitlist form now holds the two ways in */
  .cta { margin: 32px auto 0; width: fit-content; max-width: 100%; display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 100px; background: var(--bg); border: 1px solid #1c1c1c; backdrop-filter: blur(3px); }
  .cta a { padding: 4px 16px; border-radius: 100px; line-height: 25.6px; white-space: nowrap; }
  .cta .web { color: #9a9a9a; transition: color .2s; }
  .cta .web:hover { color: var(--text); }
  .cta .android { background: var(--accent); color: #fff; transition: filter .2s; }
  .cta .android:hover { filter: brightness(1.1); }
  .cta a:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  /* Instagram and email, as icons under the buttons */
  .social { margin-top: 20px; display: flex; justify-content: center; gap: 8px; }
  .social a { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 100px; color: #9a9a9a; border: 1px solid #1c1c1c; transition: color .2s, border-color .2s; }
  .social a:hover { color: var(--text); border-color: #3a3a3a; }
  .social a:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .social svg { width: 18px; height: 18px; }

  /* One entrance on load, like the template */
  .phone, .copy { animation: rise .9s cubic-bezier(.2, .7, .2, 1) both; }
  .copy { animation-delay: .15s; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); filter: blur(8px); } }
  @media (prefers-reduced-motion: reduce) { .phone, .copy { animation: none; } }

  @media (max-width: 600px) {
    .page { padding: 0 20px; }
    h1 { font-size: 44px; }
    .sub { text-wrap: balance; }
    .cta { width: 100%; }
    .cta a { flex: 1; text-align: center; padding: 4px 8px; font-size: 14px; }
  }

  /* Algiers at night behind the hero, darkened so the text stays readable */
  .page { isolation: isolate; }
  .page::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(1,1,1,.6) 0%, rgba(1,1,1,.4) 35%, rgba(1,1,1,.82) 62%, rgba(1,1,1,.9) 85%, #010101 100%), url(assets/alger-night.webp) center 60% / cover no-repeat; }
  @media (max-width: 600px) { .page::before { background-image: linear-gradient(180deg, rgba(1,1,1,.6) 0%, rgba(1,1,1,.4) 35%, rgba(1,1,1,.82) 62%, rgba(1,1,1,.9) 85%, #010101 100%), url(assets/alger-night-phone.webp); background-position: center; } }
  .glow { opacity: .7; }
  .sub { color: #a8a8a8; }

  section.more { padding: 72px 40px 0; }
  section.more:last-of-type { padding-bottom: 96px; }
  h2 { margin: 0 0 6px; font-size: 38px; line-height: 1.15; }
  .lede { margin: 0 0 24px; color: #8a8a8a; }

  .row { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 12px; scrollbar-width: thin; scrollbar-color: #2a2a2a transparent; }
  .card { flex: 0 0 208px; scroll-snap-align: start; }
  .poster { position: relative; aspect-ratio: 3 / 4; border-radius: 18px; overflow: hidden; background: #0e0e0e; border: 1px solid #1c1c1c; }
  .poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; transition: transform .3s; }
  .poster .blur { object-fit: cover; filter: blur(18px) brightness(.45); transform: scale(1.2); }
  .card:hover .poster img:not(.blur) { transform: scale(1.03); }
  .when { margin-top: 12px; font-size: 14px; color: #5b9cff; }
  .title { margin-top: 2px; font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .where { margin-top: 4px; font-size: 14px; color: #8a8a8a; }

  .cities { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .city { border-radius: 20px; border: 1px solid #1c1c1c; background: linear-gradient(160deg, #0c1526, #050505 70%); transition: border-color .2s; overflow: hidden; display: flex; flex-direction: column; }
  .city .pic { aspect-ratio: 3 / 2; background: #0e0e0e; overflow: hidden; }
  .city .pic img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s; }
  .city:hover .pic img { transform: scale(1.04); }
  .city .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
  .city:hover { border-color: #2c4f86; }
  .names { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; column-gap: 12px; }
  .en { font-size: 22px; font-weight: 500; }
  .ar { font-size: 18px; color: #8a8a8a; }
  .counts { display: flex; flex-direction: column; gap: 2px; font-size: 14px; color: #8a8a8a; }
  .counts b { color: #fff; font-weight: 500; }
  @media (max-width: 600px) { section.more { padding: 56px 20px 0; } .card { flex-basis: 168px; } h2 { font-size: 32px; } .cities { grid-template-columns: 1fr 1fr; gap: 10px; } .city .body { padding: 14px; gap: 10px; } .names { flex-direction: column; gap: 0; } .en { font-size: 19px; } .ar { font-size: 15px; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="page">
  <div class="glow" aria-hidden="true"></div>
  <a class="logo" href="/" aria-label="Wesh Derna?"><img src="assets/logo.svg" alt="Wesh Derna?" width="138" height="24"></a>

  <div class="phone" aria-hidden="true">
    <!-- Screen over the frame, so the frame's camera notch doesn't cover the picture -->
    <img class="frame" src="assets/phone-frame.png" alt="">
    <img class="screen" src="assets/phone-screen.jpg" alt="">
  </div>

  <div class="copy">
    <h1>Makach plan? Derna plan.</h1>
    <p class="sub">Events and places in Algerian cities. Free on Android and in your browser.</p>
    <nav class="cta" aria-label="Get the app">
      <a class="web" href="https://wesh-kayen.web.app/app/">Open the web app</a>
      <a class="android" href="https://wesh-kayen.web.app/update">Download for Android</a>
    </nav>
    <div class="social">
      <a href="https://www.instagram.com/wesh_derna_" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>
      <a href="mailto:oussamaaba1@outlook.com" aria-label="Contact by email"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg></a>
    </div>
  </div>

</main>
  <section class="more" id="week" aria-labelledby="wk" hidden>
    <h2 id="wk">This week</h2>
    <p class="lede">What's on across Algeria in the next seven days.</p>
    <div class="row"></div>
  </section>
  <section class="more" id="where" aria-labelledby="ct" hidden>
    <h2 id="ct">Available in</h2>
    <p class="lede">Where the app has events and places today.</p>
    <div class="cities"></div>
  </section>
<script src="https://wesh-kayen.web.app/app/dates.js"></script>
<script>
// This week's events and the cities, read live from the app's public catalog (same rules as the app:
// only approved items). If anything fails, both sections stay hidden.
(async () => {
  const D = window.WeshDates;
  if (!D) return;
  const APP = "https://wesh-kayen.web.app/app/";
  const BASE = "https://firestore.googleapis.com/v1/projects/wesh-kayen/databases/(default)/documents/";
  const val = (v) => !v ? null : "stringValue" in v ? v.stringValue : "integerValue" in v ? +v.integerValue
    : "doubleValue" in v ? v.doubleValue : "booleanValue" in v ? v.booleanValue : "timestampValue" in v ? v.timestampValue : null;
  async function all(col, fields) {
    const mask = fields.map((f) => "&mask.fieldPaths=" + f).join("");
    let out = [], tok = "";
    do {
      const r = await fetch(BASE + col + "?pageSize=300" + mask + (tok ? "&pageToken=" + tok : ""));
      if (!r.ok) throw new Error(col + " " + r.status);
      const j = await r.json();
      for (const d of j.documents || []) {
        const o = { id: d.name.split("/").pop() };
        for (const [k, v] of Object.entries(d.fields || {})) o[k] = val(v);
        out.push(o);
      }
      tok = j.nextPageToken || "";
    } while (tok);
    return out;
  }
  const approved = (d) => String(d.status || "approved").toLowerCase() === "approved";
  const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "";
  // Same guess as the web app when an event has no city
  const cityOf = (d) => {
    const raw = String(d.city || "").trim().toLowerCase();
    if (raw) return raw;
    const hay = (d.locationName || "") + " " + (d.areaName || "") + " " + (d.title || "") + " " + d.id;
    for (const c of ["oran", "constantine", "annaba"]) if (hay.toLowerCase().includes(c)) return c;
    return "algiers";
  };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  try {
    const [events, places, cities] = await Promise.all([
      all("events", ["status", "title", "name", "dateStr", "endDate", "city", "locationName", "areaName", "photoUrl"]),
      all("discoveryHub", ["status", "city"]),
      all("cities", ["name", "arabicName"]),
    ]);
    const t = D.today();
    const live = events.filter(approved).map((d) => ({ ...d, title: d.title || d.name || "", dateStr: D.withEndDate(d.dateStr || "", d.endDate), city: cityOf(d) }))
      .filter((e) => e.title && !D.isOver(e, t));
    const placeList = places.filter(approved).map((d) => String(d.city || "algiers").toLowerCase());
    const cityName = (id) => { const c = cities.find((x) => x.id === id); return c && c.name ? c.name.replace(/\s*\(.*$/, "") : id.charAt(0).toUpperCase() + id.slice(1); };

    // Soonest first; ongoing and repeating events after the one-offs of the same day
    const week = live.map((e) => {
      const first = [0, 1, 2, 3, 4, 5, 6].findIndex((i) => D.occursOn(e, D.plusDays(t, i)));
      const label = D.label(e, "en", t);
      return { e, label, sort: first * 10 + (/^(Every|Until|Daily)/.test(label) ? 5 : 0), first };
    }).filter((x) => x.first >= 0).sort((a, b) => a.sort - b.sort);

    if (week.length) {
      const row = document.querySelector("#week .row");
      for (const { e, label } of week) {
        const a = el("a", "card"); a.href = APP;
        const p = el("div", "poster"); const src = safeUrl(e.photoUrl);
        if (src) for (const cls of ["blur", ""]) { const i = el("img", cls); i.src = src; i.alt = ""; i.loading = "lazy"; i.referrerPolicy = "no-referrer"; i.onerror = () => i.remove(); p.append(i); }
        a.append(p, el("div", "when", label), el("div", "title", e.title), el("div", "where", cityName(e.city)));
        row.append(a);
      }
      document.getElementById("week").hidden = false;
    }

    const PHOTOS = ["algiers", "oran", "annaba", "tlemcen", "constantine"];
    const tiles = cities.map((c) => ({
      id: c.id,
      name: (c.name || c.id).replace(/\s*\(.*$/, ""),
      ar: /[a-z]/i.test(c.arabicName || "") ? "" : (c.arabicName || ""),
      events: live.filter((e) => e.city === c.id).length,
      places: placeList.filter((p) => p === c.id).length,
    })).filter((c) => c.events + c.places > 0).sort((a, b) => b.events + b.places - (a.events + a.places));
    if (tiles.length) {
      const grid = document.querySelector("#where .cities");
      for (const c of tiles) {
        const a = el("a", "city"); a.href = APP;
        const names = el("div", "names"); names.append(el("span", "en", c.name));
        if (c.ar) { const ar = el("span", "ar", c.ar); ar.lang = "ar"; names.append(ar); }
        const counts = el("div", "counts");
        const line = (n, word) => { const s = el("span"); s.append(el("b", null, String(n)), " " + word + (n > 1 ? "s" : "")); counts.append(s); };
        if (c.events) line(c.events, "upcoming event");
        if (c.places) line(c.places, "place");
        const body = el("div", "body"); body.append(names, counts);
        if (PHOTOS.includes(c.id)) { const pic = el("div", "pic"), img = el("img"); img.src = "assets/cities/" + c.id + ".webp"; img.alt = ""; img.loading = "lazy"; pic.append(img); a.append(pic); }
        a.append(body);
        grid.append(a);
      }
      document.getElementById("where").hidden = false;
    }
  } catch (err) {
    console.warn("Live sections not loaded:", err);
  }
})();
</script>
</body>
</html>
